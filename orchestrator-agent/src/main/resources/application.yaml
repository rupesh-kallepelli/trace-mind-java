server:
  port: 8083

spring:
  ai:
    vertex:
      ai:
        gemini:
          project-id: deutschebank-aipocs
          location: us-central1
          chat:
            options:
              model: gemini-2.5-pro

    mcp:
      server:
#        comment below for making server STDIO
        protocol: STREAMABLE
        enabled: true
        name: rca_analysis_mcp
        version: 1.0.0

      client:
        request-timeout: 180s
        streamable-http:
          connections:
            database-mcp:
              url: http://localhost:8081
              endpoint: /mcp
            
            opensearch-mcp:
              url: http://localhost:8080
              endpoint: /mcp
            
            kuberenetes-mcp:
              url: https://kubernetes-mcp-kallepelli-rupesh-dev.apps.rm1.0a51.p1.openshiftapps.com
              endpoint: /mcp
            # github-mcp:
            #   url: https://github-mcp-kallepelli-rupesh-dev.apps.rm1.0a51.p1.openshiftapps.com
            #   endpoint: /mcp

agent:
  database:
    tool-prefix: "database_"
  logs:
    tool-prefix: "opensearch_"
  sourcecode:
    tools: search_repositories,search_code,search_issues,search_pull_requests,get_file_contents,get_commit,list_commits,list_branches
  runtime:
    tool-prefixes: pods_,deployment,deployments,events,service,configmap,ingress
    # tool-prefixes: pods_,deployment,deployments,events,node,nodes,service,configmap,ingress
  main:
    tool-names: investigate_logs,investigate_database,investigate_source_code,investigate_runtime

logging:
  level:
    '[com.hcltech.orchestrator_agent]': DEBUG