server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/petclinic?options=-c%20TimeZone=Asia/Kolkata
    username: petclinic
    password: petclinic
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        TimeZone: Asia/Kolkata
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  ai:
    vertex:
      ai:
        gemini:
          project-id: deutschebank-aipocs
          location: us-central1
          chat:
            options:
              model: gemini-2.5-pro

    mcp:
      server:
        #        comment below for making server STDIO
        protocol: STREAMABLE
        enabled: true
        name: rca_analysis_mcp
        version: 1.0.0

      client:
        request-timeout: 300s
        streamable-http:
          connections:
            database-mcp:
              url: http://database-query-mcp-server-kallepallirupesh-dev.apps.rm2.thpm.p1.openshiftapps.com
              endpoint: /mcp
            metrics-mcp:
              url: http://metrics-mcp-server-kallepallirupesh-dev.apps.rm2.thpm.p1.openshiftapps.com
              endpoint: /mcp
            traces-mcp:
              url: http://traces-mcp-server-kallepallirupesh-dev.apps.rm2.thpm.p1.openshiftapps.com
              endpoint: /mcp

            logs-mcp:
              url: http://log-search-mcp-server-kallepallirupesh-dev.apps.rm2.thpm.p1.openshiftapps.com
              endpoint: /mcp
            kuberenetes-mcp:
              url: https://kubernetes-mcp-kallepallirupesh-dev.apps.rm2.thpm.p1.openshiftapps.com
              endpoint: /mcp
            # github-mcp:
            #   url: https://github-mcp-kallepelli-rupesh-dev.apps.rm1.0a51.p1.openshiftapps.com
            #   endpoint: /mcp

agent:
  database:
    tool-prefix: "database_"
  logs:
    tool-prefix: "opensearch_"
  sourcecode:
    tools: search_repositories,search_code,search_issues,search_pull_requests,get_file_contents,get_commit,list_commits,list_branches
  runtime:
    tool-prefixes: pods_,deployment,deployments,events,service,configmap,ingress
    # tool-prefixes: pods_,deployment,deployments,events,node,nodes,service,configmap,ingress
  main:
    tool-names: investigate_logs,investigate_database,investigate_source_code,investigate_runtime,investigate_metrics,investigate_traces,retrieve_recent_investigations
  metrics:
    tool-prefixes: metric_
  traces:
    tool-prefixes: trace_


tracemind:
  api:
    base-url: http://localhost:8084

logging:
  level:
    "[com.hcltech.orchestrator_agent]": DEBUG
