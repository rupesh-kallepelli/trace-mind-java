  - name: vets-service
    enabled: true
    replicaCount: 1

    image:
      repository: springcommunity/spring-petclinic-vets-service
      tag: latest
      pullPolicy: IfNotPresent

    service:
      enabled: true
      type: ClusterIP
      port: 8083
      targetPort: 8083

    route:
      enabled: false

    metrics:
      enabled: true
      path: /actuator/prometheus
      port: 8083

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

    env: []
    envFrom: []

    ports:
      - name: http
        containerPort: 8083
        protocol: TCP

    probes:
      startup:
        enabled: false
        httpGet:
          path: /actuator/health
          port: 8083
        failureThreshold: 30
        periodSeconds: 5

      readiness:
        enabled: false
        httpGet:
          path: /actuator/health
          port: 8083
        initialDelaySeconds: 20
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6

      liveness:
        enabled: false
        httpGet:
          path: /actuator/health
          port: 8083
        initialDelaySeconds: 60
        periodSeconds: 20
        timeoutSeconds: 5
        failureThreshold: 3
        
    volumeMounts:
      - name: app-logs
        mountPath: /logs

    volumes:
      - name: app-logs
        emptyDir: {}

      - name: fluent-bit-config
