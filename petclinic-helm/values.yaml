global:
  imagePullSecrets: []
  commonEnv:
    - name: SPRING_PROFILES_ACTIVE
      value: docker,mysql

    - name: JAVA_TOOL_OPTIONS
      value: "-Dlogging.file.name=/logs/application.log"

    - name: CONFIG_SERVER_URL
      value: http://config-server:8888

    - name: EUREKA_SERVER_URL
      value: http://discovery-server:8761/eureka

    - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
      value: http://tracing-server:9411/api/v2/spans

    - name: SPRING_DATASOURCE_URL
      value: jdbc:mysql://mysql:3306/petclinic

    - name: SPRING_DATASOURCE_USERNAME
      value: petclinic

    - name: SPRING_DATASOURCE_PASSWORD
      value: petclinic

  commonLabels: {}

  commonAnnotations: {}

  replicaCount: 1

  image:
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 100m

      memory: 256Mi

    limits:
      memory: 512Mi

applications:
  - name: config-server
    enabled: true
    replicaCount: 1

    image:
      repository: springcommunity/spring-petclinic-config-server
      tag: latest
      pullPolicy: IfNotPresent

    service:
      enabled: true
      type: ClusterIP
      port: 8888
      targetPort: 8888

    route:
      enabled: true
      host: ""
      tls:
        enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

    volumeMounts:
      - name: app-logs
        mountPath: /logs

    volumes:
      - name: app-logs
        emptyDir: {}

      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config

    sidecars:
      - name: fluent-bit
        image: cr.fluentbit.io/fluent/fluent-bit:3.2
        imagePullPolicy: IfNotPresent

        volumeMounts:
          - name: app-logs
            mountPath: /logs

          - name: fluent-bit-config
            mountPath: /fluent-bit/etc

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi

    env: []
    envFrom: []

    ports:
      - name: http
        containerPort: 8888
        protocol: TCP

    probes:
      startup:
        enabled: false
      readiness:
        enabled: false
        httpGet:
          path: /
          port: 8888
      liveness:
        enabled: false
        httpGet:
          path: /
          port: 8888
    metrics:
      enabled: true
      path: /actuator/prometheus
      port: 8888

  - name: discovery-server
    enabled: true
    replicaCount: 1

    image:
      repository: springcommunity/spring-petclinic-discovery-server
      tag: latest
      pullPolicy: IfNotPresent

    service:
      enabled: true
      type: ClusterIP
      port: 8761
      targetPort: 8761

    metrics:
      enabled: true
      path: /actuator/prometheus
      port: 8761

    route:
      enabled: false
      host: ""
      tls:
        enabled: false

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

    env: []
    envFrom: []

    ports:
      - name: http
        containerPort: 8761
        protocol: TCP

    probes:
      startup:
        enabled: false
      readiness:
        enabled: false
        httpGet:
          path: /
          port: 8761
      liveness:
        enabled: false
        httpGet:
          path: /
          port: 8761
        
    volumeMounts:
      - name: app-logs
        mountPath: /logs

    volumes:
      - name: app-logs
        emptyDir: {}

      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config

    sidecars:
      - name: fluent-bit
        image: cr.fluentbit.io/fluent/fluent-bit:3.2
        imagePullPolicy: IfNotPresent

        volumeMounts:
          - name: app-logs
            mountPath: /logs

          - name: fluent-bit-config
            mountPath: /fluent-bit/etc

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
