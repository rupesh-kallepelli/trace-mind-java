          path: /
          port: 9090

        
    volumeMounts:
      - name: app-logs
        mountPath: /logs

    volumes:
      - name: app-logs
        emptyDir: {}

      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config

    sidecars:
      - name: fluent-bit
        image: cr.fluentbit.io/fluent/fluent-bit:3.2
        imagePullPolicy: IfNotPresent

        volumeMounts:
          - name: app-logs
