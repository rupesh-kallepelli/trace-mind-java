  - name: grafana-server
    enabled: true
    replicaCount: 1

    image:
      repository: grafana/grafana
      tag: latest
      pullPolicy: IfNotPresent

    service:
      enabled: true
      type: ClusterIP
      port: 3000
      targetPort: 3000

    metrics:
      enabled: true
      path: /actuator/prometheus
      port: 3000

    route:
      enabled: true
      host: ""
      tls:
        enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

    env: []
    envFrom: []

    ports:
      - name: http
        containerPort: 3000
        protocol: TCP

    probes:
      startup:
        enabled: false
      readiness:
        enabled: false
      liveness:
        enabled: false
        
    volumeMounts:
      - name: app-logs
        mountPath: /logs

    volumes:
      - name: app-logs
        emptyDir: {}

      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config

    sidecars:
      - name: fluent-bit
        image: cr.fluentbit.io/fluent/fluent-bit:3.2
        imagePullPolicy: IfNotPresent

        volumeMounts:
          - name: app-logs
            mountPath: /logs

          - name: fluent-bit-config
            mountPath: /fluent-bit/etc

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi

  - name: prometheus-server
    enabled: true

    image:
      repository: prom/prometheus
      tag: v3.13.0
      pullPolicy: IfNotPresent

    service:
      enabled: true
      type: ClusterIP
      port: 9090
      targetPort: 9090

    route:
      enabled: true
      host: ""
      tls:
        enabled: true

    ports:
      - name: http
        containerPort: 9090
        protocol: TCP

    args:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/tmp/prometheus"

    volumeMounts:
      - name: prometheus-config
        mountPath: /etc/prometheus/prometheus.yml
        subPath: prometheus.yml

      - name: prometheus-storage
        mountPath: /tmp/prometheus

    volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config

      - name: prometheus-storage
        emptyDir: {}

    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

  - name: loki
    enabled: true
    replicaCount: 1

    image:
      repository: grafana/loki
      tag: "3.5.0"
      pullPolicy: IfNotPresent

    service:
      enabled: true
      type: ClusterIP
      port: 3100
      targetPort: 3100

    ports:
      - name: http
        containerPort: 3100
        protocol: TCP

    args:
      - "-config.file=/etc/loki/loki.yaml"

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

    route:
      enabled: false

    metrics:
      enabled: true
      path: /metrics
      port: 3100
        
    volumeMounts:
      - name: loki-config
        mountPath: /etc/loki

      - name: loki-storage
        mountPath: /loki

      - name: app-logs
        mountPath: /logs

    volumes:
      - name: loki-config
        configMap:
          name: loki-config

      - name: loki-storage
        emptyDir: {}

      - name: app-logs
        emptyDir: {}

      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config

    sidecars:
      - name: fluent-bit
        image: cr.fluentbit.io/fluent/fluent-bit:3.2
        imagePullPolicy: IfNotPresent

        volumeMounts:
          - name: app-logs
            mountPath: /logs

          - name: fluent-bit-config
            mountPath: /fluent-bit/etc

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi

  - name: kubernetes-mcp
    enabled: true

    replicaCount: 1

    image:
      repository: quay.io/containers/kubernetes_mcp_server
      tag: latest
      pullPolicy: IfNotPresent

    service:
      enabled: true
      type: ClusterIP
      port: 8080
      targetPort: 8080

    route:
      enabled: true
      host: ""
      tls:
        enabled: true

    serviceAccount:
      create: true
      name: kubernetes-mcp

    rbac:
      create: true

    ports:
      - name: http
        containerPort: 8080
        protocol: TCP

    env: []

    envFrom: []

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    podSecurityContext:
      runAsNonRoot: true

    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    probes:
      startup:
        enabled: false

      readiness:
        enabled: false

      liveness:
        enabled: false

    terminationGracePeriodSeconds: 30

    volumeMounts:
      - name: app-logs
        mountPath: /logs

    volumes:
      - name: app-logs
        emptyDir: {}

      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config

    sidecars:
      - name: fluent-bit
        image: cr.fluentbit.io/fluent/fluent-bit:3.2
        imagePullPolicy: IfNotPresent

        volumeMounts:
          - name: app-logs
            mountPath: /logs

          - name: fluent-bit-config
            mountPath: /fluent-bit/etc

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi

  - name: mysql
    enabled: true

    replicaCount: 1

    image:
      repository: mysql
      tag: "8.4"
      pullPolicy: IfNotPresent

    service:
      enabled: true
      type: ClusterIP
      port: 3306
      targetPort: 3306

    route:
      enabled: false

    ports:
      - name: mysql
        containerPort: 3306
        protocol: TCP

    env:
      - name: MYSQL_ROOT_PASSWORD
        value: root

      - name: MYSQL_DATABASE
        value: petclinic

      - name: MYSQL_USER
        value: petclinic

      - name: MYSQL_PASSWORD
        value: petclinic

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

    persistence:
      enabled: true
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 5Gi

    volumeMounts:
      - name: mysql-data
        mountPath: /var/lib/mysql

    volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-pvc

    probes:
      startup:
        enabled: true
        tcpSocket:
          port: 3306
        failureThreshold: 30
        periodSeconds: 10

      readiness:
        enabled: true
        tcpSocket:
          port: 3306
        initialDelaySeconds: 20
        periodSeconds: 10

      liveness:
        enabled: true
        tcpSocket:
          port: 3306
        initialDelaySeconds: 60
        periodSeconds: 20

  - name: opensearch
    enabled: true

    replicaCount: 1

    image:
      repository: image-registry.openshift-image-registry.svc:5000/kallepelli-rupesh-dev/opensearch-patched
      tag: latest
      pullPolicy: IfNotPresent

    service:
      enabled: true
      type: ClusterIP
      port: 9200
      targetPort: 9200

    route:
      enabled: true
      host: ""
      tls:
        enabled: true

    ports:
      - name: http
        containerPort: 9200

      - name: transport
        containerPort: 9600

    env:
      - name: discovery.type
        value: single-node

      - name: DISABLE_SECURITY_PLUGIN
        value: "true"

      - name: OPENSEARCH_JAVA_OPTS
        value: "-Xms512m -Xmx512m"

      - name: bootstrap.memory_lock
        value: "true"

    resources:
      requests:
        cpu: 250m
        memory: 1Gi

      limits:
        cpu: "1"
        memory: 2Gi

    podSecurityContext:
      fsGroup: 1003540000

    containerSecurityContext:
      runAsUser: 1003540000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
    persistence:
      enabled: true
      size: 10Gi
      accessModes:
        - ReadWriteOnce

    volumeMounts:
      - name: opensearch-data
        mountPath: /usr/share/opensearch/data

    volumes:
      - name: opensearch-data
        persistentVolumeClaim:
          claimName: opensearch-pvc

    probes:
      startup:
        enabled: false

      readiness:
        enabled: false

      liveness:
        enabled: false

  - name: opensearch-dashboards
    enabled: true

    replicaCount: 1

    image:
      repository: opensearchproject/opensearch-dashboards
      tag: "2.19.1"
      pullPolicy: IfNotPresent

    service:
      enabled: true
      type: ClusterIP
      port: 9200
      targetPort: 9200

    route:
      enabled: true
      host: ""
      tls:
        enabled: true

    ports:
      - name: http
        containerPort: 9200

      - name: transport
        containerPort: 9600

    env:
      - name: OPENSEARCH_HOSTS
        value: http://opensearch:9200

      - name: DISABLE_SECURITY_DASHBOARDS_PLUGIN
        value: "true"

    resources:
      requests:
        cpu: 250m
        memory: 512Mi

      limits:
        cpu: "1"
        memory: 1Gi

    probes:
      startup:
        enabled: false

      readiness:
        enabled: false

      liveness:
        enabled: false
