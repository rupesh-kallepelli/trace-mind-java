      type: ClusterIP
      port: 9090
      targetPort: 9090

    metrics:
      enabled: true
      path: /actuator/prometheus
      port: 9090

    route:
      enabled: false
      host: ""
      tls:
        enabled: false

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

    env: []
    envFrom: []

    ports:
      - name: http
        containerPort: 9090
        protocol: TCP

    probes:
      startup:
        enabled: false
      readiness:
        enabled: false
        httpGet:
          path: /
          port: 9090
