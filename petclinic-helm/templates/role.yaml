{{- range .Values.applications }}
{{- $app := . }}
{{- if and $app.enabled $app.rbac $app.rbac.create }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $app.name }}

rules:

- apiGroups: [""]
  resources:
    - pods
    - pods/log
    - services
    - endpoints
    - configmaps
    - events
    - namespaces
    - persistentvolumeclaims
  verbs:
    - get
    - list
    - watch

- apiGroups: ["apps"]
  resources:
    - deployments
    - replicasets
    - statefulsets
    - daemonsets
  verbs:
    - get
    - list
    - watch

- apiGroups: ["batch"]
  resources:
    - jobs
    - cronjobs
  verbs:
    - get
    - list
    - watch

- apiGroups: ["route.openshift.io"]
  resources:
    - routes
  verbs:
    - get
    - list
    - watch

{{- end }}
{{- end }}