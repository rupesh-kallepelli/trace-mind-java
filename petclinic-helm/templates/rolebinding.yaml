{{- range .Values.applications }}
{{- $app := . }}
{{- if and $app.enabled $app.rbac $app.rbac.create }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $app.name }}

subjects:
  - kind: ServiceAccount
    name: {{ $app.serviceAccount.name }}

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $app.name }}

{{- end }}
{{- end }}