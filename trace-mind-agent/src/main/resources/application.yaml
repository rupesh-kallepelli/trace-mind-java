server:
  port: 8084
  address: 0.0.0.0
spring:
  ai:
    vertex:
      ai:
        gemini:
          project-id: deutschebank-aipocs
          location: us-central1
          chat:
            options:
              model: gemini-2.5-pro
    mcp:
      client:
        request-timeout: 300s
        streamable-http:
          connections:
            investigate_application_issue_mcp:
              url: http://localhost:8083
              endpoint: /mcp
  datasource:
    url: jdbc:postgresql://localhost:5432/petclinic
    username: petclinic
    password: petclinic
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

agent:
  main:
    tool-names: investigate_logs,investigate_database,investigate_source_code,investigate_runtime,investigate_metrics,investigate_traces,retrieve_recent_investigations

namespace: kallepallirupesh-dev

logging:
  level:
    org.springframework.ai: DEBUG
    org.springframework.ai.tool: TRACE
    org.springframework.ai.chat.client: DEBUG
    org.springframework.ai.vertexai.gemini: DEBUG
    org.springframework.web.client: DEBUG
    "[com.hcltech.trace.mind.agent]": DEBUG
